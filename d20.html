<!DOCTYPE html>
<html lang="en">

<head> <!-- id: 56 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="True" />
    <link rel="icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon-precomposed" href="/images/apple-icon-precomposed.png">
    <title>D20 Dice Roller</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            /* Prevent default touch actions like scroll */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        #result {
            font-size: 8rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            color: #ffd700;
        }

        #instruction {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 10px;
        }

        .debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
    <!-- Import Map for modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>

<body>

    <div id="ui-container">
        <div id="result">20</div>
        <div id="instruction">Click or Swipe to Roll</div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // --- Configuration ---
        const DICE_RADIUS = 2;
        const WALL_HEIGHT = 10;
        const FLOOR_SIZE = 100;
        const COLORS = {
            diceBase: 0xaa0000,
            text: 0xffffff,
            background: 0x222222,
            light: 0xffffff
        };

        // --- Globals ---
        let scene, camera, renderer;
        let world, diceBody, floorBody;
        let diceMesh;
        let physicsMaterials = {};
        let walls = [];

        // State
        let isRolling = false;
        let lastPosition = new THREE.Vector2();
        let dragStart = new THREE.Vector2();
        let dragStartTime = 0;
        let isDragging = false;
        let rollTimeout = null;

        // --- Initialization ---
        init();
        animate();

        function init() {
            // 1. Setup Three.js Scene
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLORS.background);

            // Camera (Orthographic for perfect flat view, no fisheye)
            const aspect = window.innerWidth / window.innerHeight;
            const frisk = 10; // Zoomed in (smaller frustum = larger objects)
            camera = new THREE.OrthographicCamera(-frisk * aspect, frisk * aspect, frisk, -frisk, 1, 1000);
            camera.position.set(0, 50, 0); // Straight up
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(10, 50, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // 2. Setup Cannon-es Physics
            world = new CANNON.World();
            world.gravity.set(0, -60, 0); // Reduced gravity as requested
            world.allowSleep = true;

            // Materials
            const groundMat = new CANNON.Material();
            const diceMat = new CANNON.Material();
            const wallMat = new CANNON.Material();

            const diceGroundContact = new CANNON.ContactMaterial(groundMat, diceMat, {
                friction: 0.05,
                restitution: 0.3 // Less bouncy
            });
            const diceWallContact = new CANNON.ContactMaterial(wallMat, diceMat, {
                friction: 0,
                restitution: 0.9
            });

            world.addContactMaterial(diceGroundContact);
            world.addContactMaterial(diceWallContact);
            physicsMaterials = { ground: groundMat, dice: diceMat, wall: wallMat };

            // Floor
            const floorShape = new CANNON.Plane();
            floorBody = new CANNON.Body({ mass: 0, material: groundMat });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            // Visual Floor (Shadow catcher)
            const floorMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(FLOOR_SIZE, FLOOR_SIZE),
                new THREE.ShadowMaterial({ opacity: 0.3 })
            );
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Creates walls based on view
            updateWalls();

            // 3. Create Dice
            createD20();

            // 4. Events
            window.addEventListener('resize', onWindowResize);

            // Input Handling
            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function createD20() {
            // Geometry
            const geometry = new THREE.IcosahedronGeometry(DICE_RADIUS, 0);
            const nonIndexedGeo = geometry.toNonIndexed();
            nonIndexedGeo.computeVertexNormals();

            // Fix UVs to map each face to the full texture triangle
            const posAttribute = nonIndexedGeo.getAttribute('position');
            const count = posAttribute.count;
            const uvs = new Float32Array(count * 2);

            // Map every face to the same triangle in the texture:
            // Top-Center, Bottom-Left, Bottom-Right
            for (let i = 0; i < count; i += 3) {
                uvs[i * 2 + 0] = 0.5; uvs[i * 2 + 1] = 1.0; // v0
                uvs[i * 2 + 2] = 0.0; uvs[i * 2 + 3] = 0.0; // v1
                uvs[i * 2 + 4] = 1.0; uvs[i * 2 + 5] = 0.0; // v2
            }
            nonIndexedGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            // Create Materials with Standard D20 Layout (Opposites sum to 21)
            // 1. Calculate centroids to find opposite pairs
            const faceCount = count / 3;
            const centroids = [];
            for (let i = 0; i < faceCount; i++) {
                const a = new THREE.Vector3().fromBufferAttribute(posAttribute, i * 3 + 0);
                const b = new THREE.Vector3().fromBufferAttribute(posAttribute, i * 3 + 1);
                const c = new THREE.Vector3().fromBufferAttribute(posAttribute, i * 3 + 2);
                const center = new THREE.Vector3().addVectors(a, b).add(c).multiplyScalar(1 / 3);
                centroids.push({ index: i, center: center, assigned: false });
            }

            const labels = new Array(20);
            const pairs = [];

            // Naive pairing: Find closest to negative center
            // (For a centered icosahedron, opposite face center is exactly -center)
            for (let i = 0; i < faceCount; i++) {
                if (centroids[i].assigned) continue;

                const current = centroids[i];
                current.assigned = true;

                let bestMatch = -1;
                let minDist = Infinity;
                const target = current.center.clone().negate();

                for (let j = 0; j < faceCount; j++) {
                    if (centroids[j].assigned) continue;
                    const dist = centroids[j].center.distanceTo(target);
                    if (dist < minDist) {
                        minDist = dist;
                        bestMatch = j;
                    }
                }

                if (bestMatch !== -1) {
                    centroids[bestMatch].assigned = true;
                    pairs.push([i, bestMatch]);
                }
            }

            // Initialize labels array
            for (let i = 0; i < 20; i++) labels[i] = 0;

            // 2. Identify Vertices -> Faces map to check vertex sums
            // Map unique vertex position string to list of face indices
            const vertexMap = {};
            const pos = nonIndexedGeo.attributes.position.array;
            const tolerance = 0.01;

            for (let f = 0; f < faceCount; f++) {
                for (let v = 0; v < 3; v++) { // 3 vertices per face
                    const idx = f * 3 + v;
                    const x = pos[idx * 3];
                    const y = pos[idx * 3 + 1];
                    const z = pos[idx * 3 + 2];
                    // Quantize to identify unique
                    const key = `${Math.round(x / tolerance)},${Math.round(y / tolerance)},${Math.round(z / tolerance)}`;
                    if (!vertexMap[key]) vertexMap[key] = [];
                    vertexMap[key].push(f);
                }
            }
            const vertices = Object.values(vertexMap); // Array of [faceIdx, faceIdx, ...] (should be 5 per vertex)

            // 3. Solver: Hill Climb / Annealing with FIXED SEED
            // Use seeded RNG to ensure the result is identical every time
            let seed = 1337;
            function seededRandom() {
                const x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            // State: An assignment of the 10 pairs (1,20)...(10,11) to the 10 geometric slots (pairs array)
            // Move: Swap positions of two pairs, or Flip the values in a pair.

            // Initial state: Random valid pairs
            const currentAssignment = new Array(pairs.length).fill(0).map((_, i) => ({ pairVal: i + 1, flipped: seededRandom() > 0.5 }));
            // pairVal i+1 means the numbers are (i+1, 21-(i+1))

            // Helper to apply assignment to labels
            function applyToLabels(assign, targetLabels) {
                for (let k = 0; k < pairs.length; k++) {
                    const p = pairs[k];
                    const val = assign[k].pairVal;
                    if (assign[k].flipped) {
                        targetLabels[p[0]] = 21 - val;
                        targetLabels[p[1]] = val;
                    } else {
                        targetLabels[p[0]] = val;
                        targetLabels[p[1]] = 21 - val;
                    }
                }
            }

            function calculateScore(lbls) {
                let violations = 0;
                for (let vFaces of vertices) {
                    let s = 0;
                    for (let fIdx of vFaces) s += lbls[fIdx];
                    if (s !== 52 && s !== 53) violations++;
                }
                return violations;
            }

            // Apply initial
            applyToLabels(currentAssignment, labels);
            let bestScore = calculateScore(labels);
            let iter = 0;
            const maxIter = 5000;

            // Optimization loop
            while (bestScore > 0 && iter < maxIter) {
                // Copy state
                const nextAssignment = JSON.parse(JSON.stringify(currentAssignment));

                // Mutate
                if (seededRandom() > 0.5) {
                    // Swap two pairs
                    const a = Math.floor(seededRandom() * pairs.length);
                    const b = Math.floor(seededRandom() * pairs.length);
                    const temp = nextAssignment[a];
                    nextAssignment[a] = nextAssignment[b];
                    nextAssignment[b] = temp;
                } else {
                    // Flip a pair
                    const a = Math.floor(seededRandom() * pairs.length);
                    nextAssignment[a].flipped = !nextAssignment[a].flipped;
                }

                // Check
                applyToLabels(nextAssignment, labels);
                const score = calculateScore(labels);

                if (score < bestScore) {
                    bestScore = score;
                    // Update current
                    for (let i = 0; i < pairs.length; i++) currentAssignment[i] = nextAssignment[i];
                } else {
                    // Maybe accept worse? (Annealing) - For this simple problem, greedy usually works or simple restart.
                    // Revert labels for next iter calculation check (optimization: just don't sync if rejected)
                    // Actually we wrote to `labels` directly, need to revert `labels` if rejected.
                    if (seededRandom() < 0.01) {
                        // Small chance to accept bad move to escape local minima
                        for (let i = 0; i < pairs.length; i++) currentAssignment[i] = nextAssignment[i];
                        bestScore = score;
                    } else {
                        applyToLabels(currentAssignment, labels); // Revert
                    }
                }
                iter++;
            }

            console.log(`Solver finished in ${iter} its. Score (violations): ${bestScore}`);

            const materials = [];

            for (let i = 0; i < faceCount; i++) {
                nonIndexedGeo.addGroup(i * 3, 3, i);

                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');

                // Fill background
                ctx.fillStyle = '#aa0000';
                ctx.fillRect(0, 0, 128, 128);

                // Text
                ctx.font = 'bold 60px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Position
                ctx.translate(64, 85);

                const num = labels[i];
                let text = num.toString();

                // Distinguish 6 and 9 with a dot
                if (num === 6) text = "6.";
                if (num === 9) text = "9.";

                ctx.fillText(text, 0, 0);

                const texture = new THREE.CanvasTexture(canvas);

                materials.push(new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.4,
                    metalness: 0.1,
                    color: 0xffffff
                }));
            }
            diceMesh = new THREE.Mesh(nonIndexedGeo, materials);
            diceMesh.castShadow = true;
            diceMesh.receiveShadow = true;
            scene.add(diceMesh);
            diceMesh.userData.labels = labels;

            // Physics Body
            // Use the same geometry for physics to ensure matching shape
            const shape = qhBufferGeometryToCannonShape(nonIndexedGeo);

            diceBody = new CANNON.Body({ mass: 1, material: physicsMaterials.dice });
            diceBody.addShape(shape);
            diceBody.position.set(0, 5, 0);
            // Random initial rotation so it doesn't stand on a corner
            diceBody.quaternion.setFromEuler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            diceBody.angularDamping = 0.5;
            diceBody.linearDamping = 0.5;
            world.addBody(diceBody);
        }

        // Helper to convert Three geometry to Cannon ConvexPolyhedron
        function qhBufferGeometryToCannonShape(geometry) {
            const position = geometry.attributes.position.array;
            const vertices = [];
            const faces = [];
            const index = geometry.index ? geometry.index.array : null;

            // If it's indexed, strict mapping
            if (index) {
                for (let i = 0; i < position.length; i += 3) {
                    vertices.push(new CANNON.Vec3(position[i], position[i + 1], position[i + 2]));
                }
                for (let i = 0; i < index.length; i += 3) {
                    faces.push([index[i], index[i + 1], index[i + 2]]);
                }
            } else {
                // Non-indexed: Merge vertices to identify unique points/faces
                const pointMap = {};
                const uniquePoints = [];
                const newIndices = [];
                const tolerance = 1e-4;

                for (let i = 0; i < position.length; i += 3) {
                    const x = position[i];
                    const y = position[i + 1];
                    const z = position[i + 2];
                    // Simple quantization key
                    const key = `${Math.round(x / tolerance)},${Math.round(y / tolerance)},${Math.round(z / tolerance)}`;

                    if (pointMap[key] === undefined) {
                        pointMap[key] = uniquePoints.length;
                        uniquePoints.push(new CANNON.Vec3(x, y, z));
                    }
                    newIndices.push(pointMap[key]);
                }

                vertices.push(...uniquePoints);
                for (let i = 0; i < newIndices.length; i += 3) {
                    faces.push([newIndices[i], newIndices[i + 1], newIndices[i + 2]]);
                }
            }

            return new CANNON.ConvexPolyhedron({ vertices, faces });
        }

        // --- Input Handling ---
        function onPointerDown(e) {
            if (isRolling) return;
            isDragging = true;
            dragStart.set(e.clientX, e.clientY);
            lastPosition.set(e.clientX, e.clientY);
            dragStartTime = performance.now();

            document.getElementById('instruction').style.opacity = 0;
            document.getElementById('result').style.opacity = 0;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            lastPosition.set(e.clientX, e.clientY);
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;

            const endTime = performance.now();
            const dt = (endTime - dragStartTime) / 1000;

            // Calculate Swipe Velocity
            const deltaX = lastPosition.x - dragStart.x;
            const deltaY = lastPosition.y - dragStart.y;

            // Base impulse
            let impulseStrength = 20;

            // Direction Mapping: 
            // Screen Y- is World Z- (Forward). Screen X+ is World X+ (Right).
            // Swipe up (negative Y delta) -> throw forward (negative Z).

            let vx = (deltaX / window.innerWidth) * 100; // Arbitrary scaling
            let vz = (deltaY / window.innerHeight) * 100;

            // If swipe is tiny, treat as "Click"
            const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (dist < 10) {
                // Random throw
                vx = (Math.random() - 0.5) * 30;
                vz = (Math.random() - 0.5) * 30;
                impulseStrength = 25 + Math.random() * 10;
            } else {
                // Swipe based
                // Boost speed
                vx *= 2;
                vz *= 2;
                impulseStrength = 1; // Built into V
            }

            // Calculate World Position for Spawn
            const vec = new THREE.Vector3();
            vec.set(
                (lastPosition.x / window.innerWidth) * 2 - 1,
                -(lastPosition.y / window.innerHeight) * 2 + 1,
                0
            );
            vec.unproject(camera);
            const spawnPos = new CANNON.Vec3(vec.x, 5, vec.z);

            rollDice(new CANNON.Vec3(vx, 5, vz), spawnPos); // Add some Y lift
        }

        function rollDice(velocity, startPos) {
            isRolling = true;

            // Reset Position
            if (startPos) {
                diceBody.position.copy(startPos);
            } else {
                diceBody.position.set(0, 5, 0);
            }
            diceBody.velocity.set(0, 0, 0);
            diceBody.angularVelocity.set(0, 0, 0);

            // Apply Velocity
            diceBody.velocity.copy(velocity);

            // Add Random Rotation
            const randomRot = new CANNON.Vec3(
                Math.random() * 20 - 10,
                Math.random() * 20 - 10,
                Math.random() * 20 - 10
            );
            diceBody.angularVelocity.copy(randomRot);

            // Wake up
            diceBody.wakeUp();
        }

        // --- Environment Limits (Invisible Walls) ---
        function updateWalls() {
            // Remove old walls
            for (let w of walls) world.removeBody(w);
            walls = [];

            // Estimate visible floor area at z=0 for Ortho
            const h = camera.top; // Ortho top bounds
            const w = camera.right; // Ortho right bounds

            // No FOV calc needed for Ortho

            // Wall Thickness
            const t = 10;

            // Left (-X). Rotate around Z
            createWall(-w - t / 2, 0, t, h * 2 + 100, new CANNON.Vec3(0, 0, -0.1));
            // Right (+X). Rotate around Z
            createWall(w + t / 2, 0, t, h * 2 + 100, new CANNON.Vec3(0, 0, 0.1));
            // Top (-Z). Rotate around X
            createWall(0, -h - t / 2, w * 2 + 100, t, new CANNON.Vec3(0.1, 0, 0));
            // Bottom (+Z). Rotate around X
            createWall(0, h + t / 2, w * 2 + 100, t, new CANNON.Vec3(-0.1, 0, 0));

            function createWall(x, z, wx, wz, rotationAxis) {
                const shape = new CANNON.Box(new CANNON.Vec3(wx / 2, WALL_HEIGHT, wz / 2));
                const body = new CANNON.Body({ mass: 0, material: physicsMaterials.wall });
                body.addShape(shape);
                body.position.set(x, WALL_HEIGHT / 2, z);

                if (rotationAxis) {
                    // Axis and Angle
                    // Rotation is small, ~0.2 radians (approx 11 degrees) to create funnel
                    // Actually let's use a specific quaternion for clarity
                    const axis = new CANNON.Vec3(rotationAxis.x, rotationAxis.y, rotationAxis.z).unit();
                    // Magnitude determines sign, let's fix angle
                    const angle = 0.3; // enough slope to slide
                    // If input vector has sign, use it.
                    // Actually, let's just pass quaternion or Euler
                    // Re-doing the call signature locally in this block for simplicity

                    // Simple approach: Logic in the calls above was:
                    // Left (-X): want top to be further out (-x). So rotate ccw around Z? 
                    // Box is vertical. Rot Z+ moves top to -X? No.
                    // Let's use setFromEuler.

                    // But to minimize code change, let's just do:
                    if (rotationAxis.z !== 0) body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), rotationAxis.z > 0 ? -0.2 : 0.2);
                    if (rotationAxis.x !== 0) body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), rotationAxis.x > 0 ? 0.2 : -0.2);
                }

                world.addBody(body);
                walls.push(body);
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const frisk = 10;

            camera.left = -frisk * aspect;
            camera.right = frisk * aspect;
            camera.top = frisk;
            camera.bottom = -frisk;

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateWalls();
        }

        // --- Checker ---
        function checkResult() {
            if (!isRolling) return;

            // Check if stopped
            const v = diceBody.velocity.length();
            const w = diceBody.angularVelocity.length();

            if (v < 0.1 && w < 0.1) {
                // Settled
                if (!rollTimeout) {
                    rollTimeout = setTimeout(showResult, 500); // Wait a bit to confirm
                }
            } else {
                if (rollTimeout) {
                    clearTimeout(rollTimeout);
                    rollTimeout = null;
                }
            }
        }

        function showResult() {
            isRolling = false;
            rollTimeout = null;

            // Find face pointing UP
            // Transform local face normals to world, find one close to (0,1,0)

            // Using the geometry to get face normals.
            // Geometry normals are local. We need to rotate them by body quaternion.

            let maxDot = -Infinity;
            let bestFaceIndex = -1;

            const normalMatrix = new THREE.Matrix3().setFromMatrix4(diceMesh.matrixWorld);
            const posAttribute = diceMesh.geometry.getAttribute('position');

            // There are 20 faces. Using the group structure or known layout.
            // Our geometry is non-indexed, so every 3 vertices is a face.
            // Face normal = cross product of edges.

            const up = new THREE.Vector3(0, 1, 0);

            for (let i = 0; i < posAttribute.count; i += 3) {
                const a = new THREE.Vector3().fromBufferAttribute(posAttribute, i);
                const b = new THREE.Vector3().fromBufferAttribute(posAttribute, i + 1);
                const c = new THREE.Vector3().fromBufferAttribute(posAttribute, i + 2);

                // Calculate normal
                const cb = new THREE.Vector3().subVectors(c, b);
                const ab = new THREE.Vector3().subVectors(a, b);
                const n = new THREE.Vector3().crossVectors(cb, ab).normalize();

                // Transform to world space
                n.applyMatrix3(normalMatrix).normalize();

                const dot = n.dot(up);
                if (dot > maxDot) {
                    maxDot = dot;
                    bestFaceIndex = i / 3;
                }
            }

            if (bestFaceIndex !== -1 && diceMesh.userData.labels) {
                const number = diceMesh.userData.labels[bestFaceIndex];
                const resEl = document.getElementById('result');
                resEl.innerText = number;
                resEl.style.opacity = 1;
                document.getElementById('instruction').style.opacity = 1;
            }
        }

        // --- Loop ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Step Physics 
            world.fixedStep();

            // Sync Graphics
            diceMesh.position.copy(diceBody.position);
            diceMesh.quaternion.copy(diceBody.quaternion);

            // Check Roll State
            checkResult();

            renderer.render(scene, camera);
        }

    </script>
</body>


</html>
